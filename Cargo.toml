[package]
name = "racoon"
version = "0.1.0"
edition = "2024"
authors = ["Stan Yang <staninjapan1006@gmail.com>"]
description = "GCP Log Spy with Gemini AI"
license = "MIT"
repository = "https://github.com/Staninbui/racoon"
homepage = "https://github.com/Staninbui/racoon"
documentation = "https://docs.rs/racoon"
readme = "README.md"
keywords = ["gcp", "logging", "tui", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
# CLI
clap = { version = "4.0", features = ["derive"] }

# TUI
ratatui = "0.30.0"
crossterm = "0.29.0"

# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}

# time
chrono = { version = "0.4", features = ["serde"]}

# gcp auth
gcp_auth = "0.12"

# For getting user home directory
dirs = "5"

# reading config
toml = "0.8"

# regex
regex = "1"
tempfile = "3.24.0"

# color
colored = "2"