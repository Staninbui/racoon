# Racoon Configuration
# =====================
# This file configures racoon - GCP Log Spy with AI
#
# Location: ~/.config/racoon/config.toml (Linux/macOS)
#           %APPDATA%\racoon\config.toml (Windows)
#
# All values shown are defaults. Uncomment and modify as needed.

# ------------------------------------------------------------------------------
# AI Settings (Multi-Provider: Google, Vertex AI (ADC), OpenAI, Anthropic, Agnes AI)
# ------------------------------------------------------------------------------
[ai]
# Active AI provider ("google", "vertex", "openai", "anthropic", "agnes")
# Tip: Use "vertex" for zero-API-key enterprise compliance via GCP ADC / IAM Impersonation!
# Tip: Run `racoon models` to switch providers and models interactively!
# provider = "google"

# Active model to use for AI features
# model = "gemini-3.8-flash"

# Automatically scrub PII (emails, cards, SSNs) & secrets (JWTs, API keys, passwords) locally before sending to AI
# redact_pii = true

# Per-provider API keys & optional custom base URLs
# Environment variables also work: GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, AGNES_API_KEY
[ai.providers.google]
# api_key = "your-gemini-api-key"

[ai.providers.vertex]
# Zero-API-key mode: authenticates automatically via GCP ADC (`gcloud auth application-default login`)
# or `--impersonate-service-account`.
# project = "your-gcp-project-id" # defaults to --project or [defaults].project
# location = "us-central1"        # e.g. "us-central1", "europe-west4", or "global"

[ai.providers.openai]
# api_key = "your-openai-api-key"
# base_url = "https://api.openai.com/v1"

[ai.providers.anthropic]
# api_key = "your-anthropic-api-key"
# base_url = "https://api.anthropic.com/v1"

[ai.providers.agnes]
# api_key = "your-agnes-api-key"
# base_url = "https://apihub.agnes-ai.com/v1"

# ------------------------------------------------------------------------------
# Default Values
# ------------------------------------------------------------------------------
[defaults]
# Default GCP project (can be overridden with --project)
# project = "my-project-123"

# Optional GCP service account email to impersonate for least-privilege log access & Vertex AI
# (can also be passed via `--impersonate-service-account` or `GOOGLE_IMPERSONATE_SERVICE_ACCOUNT`)
# impersonate_service_account = "sre-prod-reader@my-project-123.iam.gserviceaccount.com"

# Default time range for log queries
# since = "1h"

# Default maximum number of logs to fetch
# limit = 100

# Default severity filter (DEBUG, INFO, WARNING, ERROR, CRITICAL)
# severity = "INFO"

# ------------------------------------------------------------------------------
# UI Settings
# ------------------------------------------------------------------------------
[ui]
# Maximum number of logs to keep in TUI memory
# max_logs = 100

# Enable mouse support in TUI
# mouse = false

# Color theme (dark/light)
# theme = "dark"

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
[logging]
# Log level for racoon itself (debug, info, warn, error)
# level = "info"
